[package]
name = "biodex"
version = "0.1.1"
edition = "2021"
rust-version = "1.85"
description = "Terminal-native species atlas with cached images, range maps, and taxonomy browsing"
repository = "https://github.com/Jakeelamb/BioDex"
homepage = "https://github.com/Jakeelamb/BioDex"
readme = "README.md"
license = "MIT"
keywords = ["biology", "taxonomy", "species", "tui", "atlas"]
categories = ["command-line-utilities", "science"]
include = [
    "Cargo.toml",
    "Cargo.lock",
    "LICENSE",
    "README.md",
    "assets/biodex-demo.gif",
    "assets/biodex-demo.mp4",
    "assets/biodex.seed.db",
    "assets/curated_animal_sources.json",
    "assets/tree_of_sex_supplement.json",
    "assets/maps/ne_basemap.png",
    "scripts/build_starter_seed_db.py",
    "scripts/generate_curated_animal_sources.py",
    "scripts/build_tree_of_sex_supplement.py",
    "src/**/*.rs",
]

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
urlencoding = "2"
dirs = "6"
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
futures = "0.3"
ratatui-image = { version = "5", default-features = false, features = ["crossterm"] }
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
rusqlite = { version = "0.32", features = ["bundled"] }
flate2 = "1.0"
csv = "1.3"
indicatif = "0.18"
rayon = "1.10"
tar = "0.4"
regex = "1"
